name: quill_diary
description: "Privacy-first offline diary for Android with local encryption, recovery key unlock, full-text search, drafts, and portable backup."
license: AGPL-3.0-or-later
publish_to: 'none'

version: 1.3.0+30

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  drift: ^2.35.0
  sqlite3: ^3.6.0
  path_provider: ^2.1.5
  path: ^1.9.1

  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  yaml: ^3.1.4
  ulid: ^2.2.0

  flex_color_scheme: ^9.0.0
  flex_color_picker: ^4.0.0
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  phosphor_flutter: ^2.1.0
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  animations: ^2.2.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^3.0.0

  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  file_picker: ^13.1.0
  android_file_picker: ^2.0.0

  table_calendar: ^3.2.1
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  archive: ^4.5.1

  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0

  intl: ^0.20.3
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.2

  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  # Tests directly import these for plugin mocking.
  cross_file: ^0.3.5+5
  url_launcher_platform_interface: ^2.3.2
  in_app_purchase_platform_interface: ^1.4.1
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        # - asset: assets/fonts/Inter-Bold.ttf
        #   weight: 700
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
          weight: 400
        # - asset: assets/fonts/NotoSansTC-Bold.ttf
        #   weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
